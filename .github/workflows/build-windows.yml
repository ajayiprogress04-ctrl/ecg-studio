name: Build ECG Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ECG_Studio_Windows/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ECG_Studio_Windows

    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        run: >
          python -m pip install
          -r requirements-windows.txt
          pyinstaller==6.11.1

      - name: Test processing and desktop workflow
        run: >
          python -W ignore::ResourceWarning
          -m unittest discover -s tests -v

      - name: Check interface JavaScript
        run: node --check frontend/desktop.js

      - name: Build Windows application
        run: >
          python -m PyInstaller
          --clean --noconfirm --onedir --paths .
          --name ECG_Studio
          --icon frontend/assets/icon.ico
          --add-data "frontend;frontend"
          desktop/launcher.py

      - name: Test bundled application
        shell: pwsh
        run: |
          $p = Start-Process `
            -FilePath "dist/ECG_Studio/ECG_Studio.exe" `
            -ArgumentList "--self-test" `
            -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Application test failed: $($p.ExitCode)"
          }

      - name: Add instructions and licences
        shell: pwsh
        run: |
          Copy-Item WINDOWS_START_HERE.txt dist/ECG_Studio/START_HERE.txt
          Copy-Item TEST_REPORT.md dist/ECG_Studio/TEST_REPORT.md
          Copy-Item App_Preferences.md dist/ECG_Studio/App_Preferences.md
          Copy-Item "$env:pythonLocation/LICENSE.txt" dist/ECG_Studio/PYTHON_LICENSE.txt

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/ECG_Studio `
            -DestinationPath ECG_Studio_Windows.zip

      - name: Make application downloadable
        uses: actions/upload-artifact@v4
        with:
          name: ECG-Studio-Windows-x64
          path: ECG_Studio_Windows/ECG_Studio_Windows.zip
          retention-days: 14
